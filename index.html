<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyC9yDznXYM025IWXlLWbV0JrLCif40jqs4",
        authDomain: "rental-app-38aae.firebaseapp.com",
        projectId: "rental-app-38aae",
        storageBucket: "rental-app-38aae.firebasestorage.app",
        messagingSenderId: "453975591826",
        appId: "1:453975591826:web:1862b290b9c371595c0f4b"
    };

    try {
        firebase.initializeApp(firebaseConfig);
    } catch(e) {
        console.log('Firebase already initialized');
    }

    const auth = firebase.auth();
    const db = firebase.firestore();

    // Local Storage Database
    const LocalDB = {
        getUsers() {
            try {
                return JSON.parse(localStorage.getItem('users') || '[]');
            } catch(e) {
                return [];
            }
        },
        saveUser(user) {
            try {
                const users = this.getUsers();
                if (!users.find(u => u.email === user.email)) {
                    users.push(user);
                    localStorage.setItem('users', JSON.stringify(users));
                }
            } catch(e) {
                console.log('Storage error:', e);
            }
        },
        findUser(email, password) {
            try {
                return this.getUsers().find(u => u.email === email && u.password === password);
            } catch(e) {
                return null;
            }
        },
        getProps() {
            try {
                return JSON.parse(localStorage.getItem('props') || '[]');
            } catch(e) {
                return [];
            }
        },
        saveProp(prop) {
            try {
                const props = this.getProps();
                props.push(prop);
                localStorage.setItem('props', JSON.stringify(props));
            } catch(e) {
                console.log('Storage error:', e);
            }
        },
        getAgentProps(agentId) {
            try {
                return this.getProps().filter(p => p.agentId === agentId);
            } catch(e) {
                return [];
            }
        }
    };

    // Global State
    let currentUser = null;
    let userType = null;
    let allProps = [];
    let useLocal = false;
    let fbReady = false;

    // Check Firebase Connection
    setTimeout(() => {
        try {
            db.collection('_test').limit(1).get().then(() => {
                fbReady = true;
                document.getElementById('status').textContent = '✓ Firebase Connected';
            }).catch(() => {
                useLocal = true;
                fbReady = false;
                document.getElementById('status').textContent = '⚠️ Using Local Storage';
            });
        } catch(e) {
            useLocal = true;
            fbReady = false;
            document.getElementById('status').textContent = '⚠️ Using Local Storage';
        }
    }, 2000);

    // Auth Listener
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            try {
                db.collection('users').doc(user.uid).get().then(doc => {
                    if (doc.exists) {
                        userType = doc.data().userType;
                        setup();
                    }
                }).catch(() => {
                    const local = LocalDB.getUsers().find(u => u.email === user.email);
                    if (local) {
                        userType = local.userType;
                        setup();
                    }
                });
            } catch(e) {
                const local = LocalDB.getUsers().find(u => u.email === user.email);
                if (local) {
                    userType = local.userType;
                    setup();
                }
            }
        } else {
            currentUser = null;
            userType = null;
            showPage('home');
            document.getElementById('nav').classList.add('hidden');
        }
    });

    function setup() {
        document.getElementById('nav').classList.remove('hidden');
        document.getElementById('homePage').classList.add('hidden');
        if (userType === 'agent') {
            document.getElementById('dashLink').classList.remove('hidden');
            document.getElementById('searchLink').classList.add('hidden');
            showPage('dash');
            loadAgent();
        } else {
            document.getElementById('searchLink').classList.remove('hidden');
            document.getElementById('dashLink').classList.add('hidden');
            showPage('search');
            loadAll();
        }
    }

    function showPage(p) {
        document.querySelectorAll('[id$="Page"]').forEach(el => el.classList.add('hidden'));
        document.getElementById(p + 'Page').classList.remove('hidden');
    }

    function doLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
            msg('loginMsg', 'Fill all fields', 'error');
            return;
        }

        if (fbReady && !useLocal) {
            try {
                auth.signInWithEmailAndPassword(email, password).catch(e => {
                    msg('loginMsg', e.message, 'error');
                });
            } catch(e) {
                msg('loginMsg', e.message, 'error');
            }
        } else {
            const user = LocalDB.findUser(email, password);
            if (user) {
                currentUser = { email, uid: user.uid };
                userType = user.userType;
                setup();
            } else {
                msg('loginMsg', 'Invalid email or password', 'error');
            }
        }
    }

    function doAgentSignup() {
        const name = document.getElementById('agentName').value.trim();
        const email = document.getElementById('agentEmail').value.trim();
        const password = document.getElementById('agentPassword').value;
        const phone = document.getElementById('agentPhone').value.trim();

        if (!name || !email || !password || !phone) {
            msg('agentMsg', 'Fill required fields', 'error');
            return;
        }

        if (password.length < 6) {
            msg('agentMsg', 'Password must be 6+ characters', 'error');
            return;
        }

        const userData = {
            uid: 'u_' + Date.now(),
            name: name,
            email: email,
            password: password,
            phone: phone,
            agency: document.getElementById('agentAgency').value.trim(),
            address: document.getElementById('agentAddress').value.trim(),
            experience: parseInt(document.getElementById('agentExperience').value) || 0,
            commission: parseFloat(document.getElementById('agentCommission').value) || 5,
            bankAccount: document.getElementById('agentBankAccount').value.trim(),
            bankName: document.getElementById('agentBankName').value.trim(),
            bio: document.getElementById('agentBio').value.trim(),
            userType: 'agent',
            createdAt: new Date().toISOString()
        };

        if (fbReady && !useLocal) {
            try {
                auth.createUserWithEmailAndPassword(email, password).then(res => {
                    userData.uid = res.user.uid;
                    db.collection('users').doc(res.user.uid).set(userData).then(() => {
                        msg('agentMsg', '✓ Account created!', 'success');
                        setTimeout(() => showPage('home'), 1500);
                    }).catch(e => msg('agentMsg', e.message, 'error'));
                }).catch(e => msg('agentMsg', e.message, 'error'));
            } catch(e) {
                msg('agentMsg', e.message, 'error');
            }
        } else {
            LocalDB.saveUser(userData);
            currentUser = userData;
            userType = 'agent';
            msg('agentMsg', '✓ Account created! (Local)', 'success');
            setTimeout(() => setup(), 1500);
        }
    }

    function doRenterSignup() {
        const name = document.getElementById('renterName').value.trim();
        const email = document.getElementById('renterEmail').value.trim();
        const password = document.getElementById('renterPassword').value;
        const phone = document.getElementById('renterPhone').value.trim();

        if (!name || !email || !password || !phone) {
            msg('renterMsg', 'Fill all fields', 'error');
            return;
        }

        if (password.length < 6) {
            msg('renterMsg', 'Password must be 6+ characters', 'error');
            return;
        }

        const userData = {
            uid: 'u_' + Date.now(),
            name: name,
            email: email,
            password: password,
            phone: phone,
            userType: 'renter',
            createdAt: new Date().toISOString()
        };

        if (fbReady && !useLocal) {
            try {
                auth.createUserWithEmailAndPassword(email, password).then(res => {
                    userData.uid = res.user.uid;
                    db.collection('users').doc(res.user.uid).set(userData).then(() => {
                        msg('renterMsg', '✓ Account created!', 'success');
                        setTimeout(() => showPage('home'), 1500);
                    }).catch(e => msg('renterMsg', e.message, 'error'));
                }).catch(e => msg('renterMsg', e.message, 'error'));
            } catch(e) {
                msg('renterMsg', e.message, 'error');
            }
        } else {
            LocalDB.saveUser(userData);
            currentUser = userData;
            userType = 'renter';
            msg('renterMsg', '✓ Account created! (Local)', 'success');
            setTimeout(() => setup(), 1500);
        }
    }

    function toggleAddForm() {
        document.getElementById('addPropertyForm').classList.toggle('hidden');
    }

    function doAddProperty() {
        const title = document.getElementById('propTitle').value.trim();
        const location = document.getElementById('propLocation').value.trim();
        const price = parseFloat(document.getElementById('propPrice').value);
        const bedrooms = parseInt(document.getElementById('propBedrooms').value);
        const bathrooms = parseInt(document.getElementById('propBathrooms').value);
        const description = document.getElementById('propDescription').value.trim();
        const imageFile = document.getElementById('propImage').files[0];

        if (!title || !location || !price || !bedrooms || !bathrooms || !description) {
            msg('propMsg', 'Fill all fields', 'error');
            return;
        }

        const prop = {
            id: 'p_' + Date.now(),
            title: title,
            location: location,
            price: price,
            bedrooms: bedrooms,
            bathrooms: bathrooms,
            description: description,
            agentId: currentUser.uid,
            images: []
        };

        if (imageFile) {
            const reader = new FileReader();
            reader.onload = function(e) {
                prop.images = [e.target.result];
                saveProperty(prop);
            };
            reader.onerror = function() {
                saveProperty(prop);
            };
            reader.readAsDataURL(imageFile);
        } else {
            saveProperty(prop);
        }
    }

    function saveProperty(prop) {
        if (fbReady && !useLocal) {
            try {
                db.collection('properties').add(prop).then(() => {
                    clearForm();
                    loadAgent();
                }).catch(e => msg('propMsg', e.message, 'error'));
            } catch(e) {
                msg('propMsg', e.message, 'error');
            }
        } else {
            LocalDB.saveProp(prop);
            clearForm();
            loadAgent();
        }
    }

    function clearForm() {
        document.getElementById('propTitle').value = '';
        document.getElementById('propLocation').value = '';
        document.getElementById('propPrice').value = '';
        document.getElementById('propBedrooms').value = '';
        document.getElementById('propBathrooms').value = '';
        document.getElementById('propDescription').value = '';
        document.getElementById('propImage').value = '';
        document.getElementById('addPropertyForm').classList.add('hidden');
    }

    function loadAgent() {
        if (fbReady && !useLocal) {
            try {
                db.collection('properties').where('agentId', '==', currentUser.uid).get().then(snap => {
                    let html = '';
                    snap.forEach(doc => {
                        const p = doc.data();
                        html += '<div class="property-card"><div class="property-image">' + (p.images && p.images[0] ? '<img src="' + p.images[0] + '">' : '📸') + '</div><div class="property-info"><h3>' + p.title + '</h3><div class="property-location">📍 ' + p.location + '</div><div class="property-price">₦' + p.price.toLocaleString() + '</div></div></div>';
                    });
                    document.getElementById('agentPropsDisplay').innerHTML = html || '<p>No properties</p>';
                }).catch(e => console.log(e));
            } catch(e) {
                console.log(e);
            }
        } else {
            const props = LocalDB.getAgentProps(currentUser.uid);
            let html = '';
            props.forEach(p => {
                html += '<div class="property-card"><div class="property-image">' + (p.images && p.images[0] ? '<img src="' + p.images[0] + '">' : '📸') + '</div><div class="property-info"><h3>' + p.title + '</h3><div class="property-location">📍 ' + p.location + '</div><div class="property-price">₦' + p.price.toLocaleString() + '</div></div></div>';
            });
            document.getElementById('agentPropsDisplay').innerHTML = html || '<p>No properties</p>';
        }
    }

    function loadAll() {
        if (fbReady && !useLocal) {
            try {
                db.collection('properties').get().then(snap => {
                    allProps = [];
                    snap.forEach(doc => {
                        allProps.push({ id: doc.id, ...doc.data() });
                    });
                    doFilter();
                }).catch(e => console.log(e));
            } catch(e) {
                console.log(e);
            }
        } else {
            allProps = LocalDB.getProps();
            doFilter();
        }
    }

    function doFilter() {
        const loc = document.getElementById('searchLoc').value.toLowerCase();
        const minP = parseFloat(document.getElementById('searchMin').value) || 0;
        const maxP = parseFloat(document.getElementById('searchMax').value) || Infinity;
        const beds = document.getElementById('searchBeds').value;

        let filtered = allProps.filter(p => 
            (!loc || p.location.toLowerCase().includes(loc)) && 
            p.price >= minP && 
            p.price <= maxP && 
            (!beds || p.bedrooms === parseInt(beds))
        );

        let html = '';
        filtered.forEach(p => {
            html += '<div class="property-card"><div class="property-image">' + (p.images && p.images[0] ? '<img src="' + p.images[0] + '">' : '📸') + '</div><div class="property-info"><h3>' + p.title + '</h3><div class="property-location">📍 ' + p.location + '</div><div class="property-price">₦' + p.price.toLocaleString() + '</div></div></div>';
        });
        document.getElementById('renterPropsDisplay').innerHTML = html || '<p>No properties found</p>';
    }

    function doLogout() {
        if (fbReady && !useLocal) {
            try {
                auth.signOut();
            } catch(e) {
                console.log(e);
            }
        } else {
            currentUser = null;
            userType = null;
            showPage('home');
            document.getElementById('nav').classList.add('hidden');
        }
    }
